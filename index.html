<script>
        const SPREADSHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxQlshRu0qwjBfk5nhSMqbTich7vBJ516eMZpq97d1e6HbCgpuNpJaHLZXMe1Jn6m5Amg/exec";

        const DATABASE_SEED_ARTICLES = [
            { id: "ART-01", title: "Siasat Ampuh Mengatasi Kebuntuan Ide (Writer's Block) bagi Sastrawan", date: "18 Mei 2026", category: "Tips Menulis", cover: "https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&q=80&w=500" },
            { id: "ART-02", title: "Panduan Lengkap Standarisasi & Alur Pengurusan ISBN Perpustakaan Nasional", date: "12 Mei 2026", category: "Dunia Penerbitan", cover: "https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&q=80&w=500" }
        ];

        let db = {
            books: [],
            articles: DATABASE_SEED_ARTICLES,
            submissions: [],
            orders: [],
            cart: JSON.parse(localStorage.getItem('np_cart')) || [],
            currentUser: JSON.parse(localStorage.getItem('np_user')) || null
        };

        let currentPageState = 'home';
        let realtimeTimer = null;

        // Otomatisasi inisialisasi aplikasi
        window.addEventListener('DOMContentLoaded', () => {
            const lastPage = sessionStorage.getItem('np_last_page') || 'home';
            loadDatabaseFromSpreadsheet().then(() => {
                switchPage(lastPage);
            });
            // Jalankan sinkronisasi data realtime (setiap 10 detik)
            startRealtimeSync();
        });

        function startRealtimeSync() {
            if (realtimeTimer) clearInterval(realtimeTimer);
            realtimeTimer = setInterval(async () => {
                // Hanya fetch di latar belakang tanpa memicu efek loading skeleton
                try {
                    const response = await fetch(`${SPREADSHEET_WEBAPP_URL}?action=getAll`);
                    const result = await response.json();
                    if (result.status === "ok") {
                        db.books = result.data.books || [];
                        db.submissions = result.data.submissions || [];
                        db.orders = result.data.orders || [];
                        
                        // Perbarui komponen visual aktif secara halus tanpa reload page
                        if (currentPageState === 'marketplace') renderMarketplaceProducts();
                        if (currentPageState === 'admin') refreshAdminTables();
                    }
                } catch (e) { console.log("Realtime sync paused temporarily."); }
            }, 10000); 
        }

        async function loadDatabaseFromSpreadsheet() {
            try {
                const response = await fetch(`${SPREADSHEET_WEBAPP_URL}?action=getAll`);
                const result = await response.json();
                if (result.status === "ok") {
                    db.books = result.data.books || [];
                    db.submissions = result.data.submissions || [];
                    db.orders = result.data.orders || [];
                    updateCartIconBadge();
                }
            } catch (error) {
                console.error("Gagal memuat database:", error);
            }
        }

        async function postToSpreadsheetAPI(actionName, dataPayload) {
            try {
                const response = await fetch(SPREADSHEET_WEBAPP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' }, 
                    body: JSON.stringify({ action: actionName, data: dataPayload })
                });
                return await response.json();
            } catch (error) {
                return { status: "error", message: error.toString() };
            }
        }

        function commitLocalStorage() {
            localStorage.setItem('np_cart', JSON.stringify(db.cart));
            localStorage.setItem('np_user', JSON.stringify(db.currentUser));
            updateCartIconBadge();
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3 bg-white rounded-xl shadow-xl border-l-4 transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0 text-xs font-semibold ${type === 'success' ? 'border-[#56B6C6]' : 'border-rose-500'}`;
            toast.innerHTML = `${type === 'success' ? '<i class="fa-solid fa-circle-check text-primary text-base"></i>' : '<i class="fa-solid fa-triangle-exclamation text-rose-500 text-base"></i>'} <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function switchPage(pageId) {
            currentPageState = pageId;
            sessionStorage.setItem('np_last_page', pageId);
            
            const container = document.getElementById('app-content');
            const skeleton = document.getElementById('global-skeleton-layer');
            
            container.classList.add('hidden');
            skeleton.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                skeleton.classList.add('hidden');
                container.classList.remove('hidden');

                if (pageId === 'home') container.innerHTML = viewHome();
                else if (pageId === 'about') container.innerHTML = viewAbout();
                else if (pageId === 'layanan') container.innerHTML = viewLayanan();
                else if (pageId === 'marketplace') { container.innerHTML = viewMarketplace(); renderMarketplaceProducts(); }
                else if (pageId === 'naskah') container.innerHTML = viewNaskah();
                else if (pageId === 'admin') { container.innerHTML = viewAdminDashboard(); refreshAdminTables(); }

                rebootAuthViewButtons();
            }, 300);
        }

        function protectedGateCheck(targetAction) {
            if (!db.currentUser) {
                openLoginModal();
                showToast("Wajib masuk sesi terlebih dahulu.", "error");
                return;
            }
            if (targetAction === 'naskah') switchPage('naskah');
            if (targetAction === 'cart') openCartModal();
        }

        function updateCartIconBadge() {
            document.getElementById('cart-count').innerText = db.cart.reduce((s, i) => s + i.qty, 0);
        }

        function openLoginModal() {
            const m = document.getElementById('login-modal'); m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0', 'scale-95'), 10);
        }
        function closeLoginModal() {
            const m = document.getElementById('login-modal'); m.classList.add('opacity-0', 'scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        function toggleAuthTab(tab) {
            const loginBox = document.getElementById('auth-login-box');
            const regBox = document.getElementById('auth-register-box');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if(tab === 'login') {
                loginBox.classList.remove('hidden'); regBox.classList.add('hidden');
                loginBtn.className = "flex-1 pb-3 text-primary border-b-2 border-primary text-center";
                regBtn.className = "flex-1 pb-3 text-gray-400 text-center";
            } else {
                loginBox.classList.add('hidden'); regBox.classList.remove('hidden');
                loginBtn.className = "flex-1 pb-3 text-gray-400 text-center";
                regBtn.className = "flex-1 pb-3 text-primary border-b-2 border-primary text-center";
            }
        }
        
        async function handleAuthSubmit(e) {
            e.preventDefault();
            const userInput = document.getElementById('auth-username').value;
            const passInput = document.getElementById('auth-password').value;

            if (userInput === "narapustaka" && passInput === "admin1") {
                db.currentUser = { email: "admin@narapustaka.com", name: "Administrator Nara", role: "admin" };
                commitLocalStorage(); closeLoginModal(); showToast("Akses Panel Kendali Admin Terverifikasi!");
                switchPage('admin');
                return;
            }

            try {
                const response = await fetch(`${SPREADSHEET_WEBAPP_URL}?action=login&identifier=${encodeURIComponent(userInput)}&password=${encodeURIComponent(passInput)}`);
                const result = await response.json();
                if (result.status === "ok") {
                    db.currentUser = result.user;
                    commitLocalStorage(); closeLoginModal(); showToast(`Selamat datang kembali, ${result.user.name}!`);
                    switchPage(currentPageState);
                } else {
                    showToast(result.message || "Kredensial salah.", "error");
                }
            } catch (err) {
                showToast("Gagal terhubung dengan server.", "error");
            }
        }

        async function handleAuthRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;

            const newUserPayload = { id: "CUST-" + Date.now(), name, email, phone, password, role: "customer" };
            showToast("Memproses pendaftaran...");
            const res = await postToSpreadsheetAPI("registerUser", newUserPayload);
            
            if (res.status === "ok") {
                db.currentUser = res.user;
                commitLocalStorage(); closeLoginModal();
                showToast("Akun berhasil dibuat!");
                await loadDatabaseFromSpreadsheet();
                switchPage(currentPageState);
            } else {
                showToast(res.message || "Registrasi gagal.", "error");
            }
        }
        
        function handleUserLogout() {
            db.currentUser = null; commitLocalStorage(); showToast("Sesi aman berakhir.");
            switchPage('home');
        }
        
        function rebootAuthViewButtons() {
            const btn = document.getElementById('nav-login-btn');
            const adminBtn = document.getElementById('nav-admin-btn');
            const mobileLoginDockBtn = document.getElementById('mobile-login-dock-btn');

            if(db.currentUser) { 
                btn.innerText = "Keluar"; 
                btn.onclick = handleUserLogout; 
                btn.className = "px-4 py-2 text-xs font-bold text-gray-500 hover:text-rose-500 bg-gray-100 rounded-xl transition-all";
                
                if (mobileLoginDockBtn) {
                    mobileLoginDockBtn.innerHTML = `<i class="fa-solid fa-right-from-bracket text-lg text-rose-500"></i><span class="text-[9px] mt-1 font-medium text-rose-500">Keluar</span>`;
                    mobileLoginDockBtn.onclick = handleUserLogout;
                }

                if(db.currentUser.role === 'admin') {
                    adminBtn.classList.remove('hidden'); adminBtn.classList.add('flex');
                } else {
                    adminBtn.classList.remove('flex'); adminBtn.classList.add('hidden');
                }
            } else { 
                btn.innerText = "Masuk"; 
                btn.onclick = openLoginModal; 
                btn.className = "px-5 py-2.5 text-sm font-bold text-white bg-primary hover:bg-[#47a3b3] rounded-xl transition-all shadow-md shadow-[#56B6C6]/20"; 
                adminBtn.classList.remove('flex'); adminBtn.classList.add('hidden');

                if (mobileLoginDockBtn) {
                    mobileLoginDockBtn.innerHTML = `<i class="fa-solid fa-circle-user text-lg"></i><span class="text-[9px] mt-1 font-medium">Masuk</span>`;
                    mobileLoginDockBtn.onclick = openLoginModal;
                }
            }
        }

        function openSearchModal() {
            const m = document.getElementById('search-modal'); m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0', 'scale-95'), 10);
            document.getElementById('global-search-input').focus();
        }
        function closeSearchModal() {
            const m = document.getElementById('search-modal'); m.classList.add('opacity-0', 'scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
            document.getElementById('global-search-input').value = '';
            document.getElementById('search-results-container').innerHTML = '';
        }
        function handleGlobalSearch(val) {
            const container = document.getElementById('search-results-container');
            if(!val.trim()) { container.innerHTML = ''; return; }
            const res = db.books.filter(b => b.title.toLowerCase().includes(val.toLowerCase()) || b.author.toLowerCase().includes(val.toLowerCase()));
            if(res.length === 0) {
                container.innerHTML = `<div class="p-3 text-xs text-gray-400 text-center">Buku tidak ditemukan</div>`;
                return;
            }
            container.innerHTML = res.map(b => `
                <div onclick="closeSearchModal(); openDetailModal('${b.id}')" class="p-3 flex items-center gap-3 hover:bg-gray-50 cursor-pointer transition-colors">
                    <img src="${b.cover}" class="w-10 h-14 object-cover rounded shadow-sm">
                    <div>
                        <h4 class="text-xs font-bold text-gray-900">${b.title}</h4>
                        <p class="text-[10px] text-gray-400 mt-0.5">${b.author}</p>
                    </div>
                </div>
            `).join('');
        }

        function openDetailModal(bookId) {
            const book = db.books.find(b => b.id === bookId);
            if (!book) return;
            
            const modal = document.getElementById('detail-modal');
            const body = document.getElementById('detail-modal-body');
            
            body.innerHTML = `
                <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 z-10"><i class="fa-solid fa-xmark text-lg"></i></button>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                    <div class="md:col-span-2 flex flex-col items-center">
                        <img src="${book.cover}" class="w-full max-w-[200px] aspect-[3/4] object-cover rounded-2xl shadow-xl border border-gray-100">
                    </div>
                    <div class="md:col-span-3 flex flex-col justify-between space-y-4">
                        <div>
                            <span class="px-2.5 py-1 bg-[#56B6C6]/10 text-primary text-[10px] font-bold rounded-lg uppercase tracking-wider">${book.category || 'Literasi'}</span>
                            <h3 class="text-lg font-bold text-gray-900 mt-2 leading-snug">${book.title}</h3>
                            <p class="text-xs text-gray-400 mt-1">Penulis: <span class="text-gray-600 font-semibold">${book.author}</span></p>
                            <p class="text-sm text-primary font-bold mt-2">Rp ${(Number(book.price) || 0).toLocaleString('id-ID')}</p>
                        </div>
                        <div class="border-t border-b border-gray-100 py-3">
                            <h4 class="text-xs font-bold text-gray-800 uppercase mb-1">Sinopsis Buku</h4>
                            <p class="text-xs text-gray-500 leading-relaxed max-h-32 overflow-y-auto pr-1">${book.synopsis || 'Tidak ada sinopsis untuk buku ini.'}</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="addToCart('${book.id}')" class="flex-1 py-3 bg-primary hover:bg-[#47a3b3] text-white text-xs font-bold uppercase tracking-wider rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cart-plus"></i> Masukkan Keranjang
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0', 'scale-95'), 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.add('opacity-0', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function addToCart(bookId) {
            const book = db.books.find(b => b.id === bookId);
            if (!book) return;
            
            const existingItem = db.cart.find(item => item.id === bookId);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                db.cart.push({ id: book.id, title: book.title, price: book.price, cover: book.cover, qty: 1 });
            }
            
            commitLocalStorage();
            showToast(`"${book.title}" berhasil dimasukkan ke keranjang.`);
            closeDetailModal();
        }

        function openCartModal() {
            const modal = document.getElementById('detail-modal');
            const body = document.getElementById('detail-modal-body');
            
            if (db.cart.length === 0) {
                body.innerHTML = `
                    <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    <div class="text-center py-8 space-y-3">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto text-gray-300"><i class="fa-solid fa-bag-shopping text-2xl"></i></div>
                        <h3 class="text-sm font-bold text-gray-900">Keranjang Belanja Kosong</h3>
                    </div>
                `;
            } else {
                const totalPayment = db.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                body.innerHTML = `
                    <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    <h3 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b border-gray-100 pb-3 mb-4 flex items-center gap-2"><i class="fa-solid fa-basket-shopping text-primary"></i> Tas Belanja Anda</h3>
                    <div class="divide-y divide-gray-100 max-h-48 overflow-y-auto mb-4 hide-scrollbar">
                        ${db.cart.map(item => `
                            <div class="flex items-center justify-between py-2.5 gap-3">
                                <img src="${item.cover}" class="w-8 h-11 object-cover rounded shadow-sm border border-gray-50">
                                <div class="flex-1 min-w-0">
                                    <h4 class="text-xs font-bold text-gray-900 truncate">${item.title}</h4>
                                    <p class="text-[10px] text-gray-500">Rp ${(Number(item.price) || 0).toLocaleString('id-ID')} x ${item.qty}</p>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="updateCartQty('${item.id}', -1)" class="w-5 h-5 rounded bg-gray-100 text-gray-600 font-bold flex items-center justify-center text-xs">-</button>
                                    <button onclick="updateCartQty('${item.id}', 1)" class="w-5 h-5 rounded bg-gray-100 text-gray-600 font-bold flex items-center justify-center text-xs">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="border-t border-gray-100 pt-3 space-y-3">
                        <div class="flex justify-between items-center text-xs font-bold text-gray-900">
                            <span>Subtotal Buku</span>
                            <span class="text-primary text-sm">Rp ${totalPayment.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-xl space-y-2">
                            <label class="block text-[10px] font-bold text-gray-700 uppercase">Alamat Pengiriman</label>
                            <textarea id="checkout-address" class="w-full p-2 bg-white border border-gray-200 rounded-lg text-xs focus:outline-none focus:border-primary" rows="2" placeholder="Tulis nama jalan, kota, dan kode pos..."></textarea>
                        </div>
                        <button onclick="handleCheckoutAction()" class="w-full py-3 bg-primary hover:bg-[#47a3b3] text-white text-xs font-bold uppercase tracking-wider rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-lock text-[10px]"></i> Konfirmasi Pemesanan
                        </button>
                    </div>
                `;
            }
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0', 'scale-95'), 10);
        }

        function updateCartQty(bookId, delta) {
            const item = db.cart.find(i => i.id === bookId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                db.cart = db.cart.filter(i => i.id !== bookId);
            }
            commitLocalStorage();
            openCartModal();
        }

        async function handleCheckoutAction() {
            const address = document.getElementById('checkout-address').value.trim();
            if (!address) {
                showToast("Wajib mengisi alamat pengiriman.", "error");
                return;
            }
            
            const totalPayment = db.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const orderPayload = {
                id: "ORD-" + Date.now(),
                userEmail: db.currentUser.email,
                userName: db.currentUser.name,
                userPhone: db.currentUser.phone || '-',
                items: JSON.stringify(db.cart),
                total: totalPayment,
                address: address,
                shipping: 0, // Default sebelum diubah admin
                atm: "BCA - 1234567890 a/n Nara Pustaka", // Default rekening bank
                status: "Pending",
                date: new Date().toLocaleDateString('id-ID')
            };
            
            showToast("Mengirimkan pesanan...");
            const res = await postToSpreadsheetAPI("createOrder", orderPayload);
            
            if (res.status === "ok") {
                db.cart = [];
                commitLocalStorage();
                closeDetailModal();
                showToast("Pesanan berhasil dibuat! Hubungi admin untuk kelanjutan invoice.");
                await loadDatabaseFromSpreadsheet();
            } else {
                showToast("Gagal memproses pesanan.", "error");
            }
        }

        async function handleSubmissionForm(e) {
            e.preventDefault();
            const title = document.getElementById('sub-title').value;
            const genre = document.getElementById('sub-genre').value;
            const synopsis = document.getElementById('sub-synopsis').value;
            const driveUrl = document.getElementById('sub-drive-url').value;

            const subPayload = {
                id: "SUB-" + Date.now(),
                userEmail: db.currentUser.email,
                userName: db.currentUser.name,
                title, genre, synopsis, driveUrl,
                status: "Dalam Review",
                date: new Date().toLocaleDateString('id-ID')
            };

            showToast("Mengirim naskah...");
            const res = await postToSpreadsheetAPI("createSubmission", subPayload);
            if (res.status === "ok") {
                showToast("Naskah sukses diajukan!");
                document.getElementById('form-pengajuan-naskah').reset();
                await loadDatabaseFromSpreadsheet();
                switchPage('home');
            } else {
                showToast("Gagal mengirimkan naskah.", "error");
            }
        }

        // Fungsi mengonversi file gambar ke string Base64 agar hemat resource
        function convertImageToBase64(fileInputId) {
            return new Promise((resolve) => {
                const file = document.getElementById(fileInputId).files[0];
                if (!file) return resolve("");
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }

        async function handleCreateBookAdmin(e) {
            e.preventDefault();
            const title = document.getElementById('adm-title').value;
            const author = document.getElementById('adm-author').value;
            const price = Number(document.getElementById('adm-price').value);
            const category = document.getElementById('adm-category').value;
            const synopsis = document.getElementById('adm-synopsis').value;
            
            showToast("Mengonversi foto buku...");
            const base64Image = await convertImageToBase64('adm-cover-file');
            
            if(!base64Image) {
                showToast("Wajib mengunggah file foto cover!", "error");
                return;
            }

            const newBook = { 
                id: "BOOK-" + Date.now(), 
                title, author, price, category, 
                cover: base64Image, // File langsung dikirim dalam bentuk string Base64
                synopsis 
            };

            showToast("Menambahkan buku ke database...");
            const res = await postToSpreadsheetAPI("addBook", newBook);

            if (res.status === "ok") {
                showToast("Buku baru berhasil diterbitkan!");
                document.getElementById('form-admin-add-book').reset();
                await loadDatabaseFromSpreadsheet();
                refreshAdminTables();
            } else {
                showToast("Gagal menyimpan data buku.", "error");
            }
        }

        function refreshAdminTables() {
            const bookTbody = document.getElementById('adm-table-books');
            const orderTbody = document.getElementById('adm-table-orders');
            const subTbody = document.getElementById('adm-table-submissions');

            if (bookTbody) {
                bookTbody.innerHTML = db.books.map(b => `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 text-xs">
                        <td class="p-3 font-bold">${b.id}</td>
                        <td class="p-3 flex items-center gap-2">
                            <img src="${b.cover}" class="w-6 h-9 object-cover rounded shadow-sm"> 
                            <span class="font-semibold text-gray-900 truncate max-w-[120px]">${b.title}</span>
                        </td>
                        <td class="p-3 text-gray-600">${b.author}</td>
                        <td class="p-3 text-primary font-bold">Rp ${(Number(b.price)||0).toLocaleString('id-ID')}</td>
                    </tr>
                `).join('');
            }

            if (orderTbody) {
                orderTbody.innerHTML = db.orders.map(o => `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 text-xs">
                        <td class="p-3 font-bold">${o.id}</td>
                        <td class="p-3">
                            <div><span class="font-bold text-gray-900 block">${o.userName}</span></div>
                        </td>
                        <td class="p-3 text-primary font-semibold">Rp ${(Number(o.total)||0).toLocaleString('id-ID')}</td>
                        <td class="p-3">
                            <div class="space-y-1">
                                <input type="number" id="ship-${o.id}" value="${o.shipping || 0}" class="w-20 p-1 border rounded text-[11px]" placeholder="Ongkir">

        async function updateOrderStatusAPI(orderId, nextStatus) {
            const currentOngkir = Number(document.getElementById(`ship-${orderId}`).value) || 0;
            const currentAtm = document.getElementById(`atm-${orderId}`).value || "-";

            showToast("Memperbarui status transaksi...");
            const res = await postToSpreadsheetAPI("updateOrderStatus", { id: orderId, status: nextStatus, shipping: currentOngkir, atm: currentAtm });
            if (res.status === "ok") {
                showToast("Transaksi sukses diperbarui!");
                await loadDatabaseFromSpreadsheet();
                refreshAdminTables();
            } else {
                showToast("Gagal memperbarui status.", "error");
            }
        }
