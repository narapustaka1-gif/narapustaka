    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Mobile Device Frame Simulation if on Desktop, native style on Mobile */
        @media (min-width: 640px) {
            .phone-frame {
                max-width: 440px;
                margin: 20px auto;
                border-radius: 40px;
                box-shadow: 0 0 0 12px #1e293b, 0 20px 50px rgba(0,0,0,0.3);

                position: relative;

            scrollbar-width: none;

<body class="bg-slate-900 flex justify-center items-center min-h-screen">

    <div class="w-full h-screen sm:h-auto phone-frame bg-white flex flex-col justify-between text-slate-800">
        
        <!-- Top App Header -->
        <header class="bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between sticky top-0 z-40">
            <!-- Satu Logo Utama Konsisten & Permanen -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-primary-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-primary-100">

            <div class="flex items-center gap-3">

        <!-- Bottom Navigation Bar for Native App Feel -->

            <button onclick="router.navigate('orders')" id="nav-orders" class="flex flex-col items-center gap-1 text-slate-400 transition-all">

        <!-- PWA Install Banner Toast -->

                <div>
                    <h4 class="text-xs font-bold font-sans">Install Nara Pustaka</h4>
                    <p class="text-[10px] text-slate-300">Akses lebih cepat & hemat kuota!</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="pwaSimulateInstall()" class="bg-primary-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg">Install</button>
                <button onclick="dismissPwaToast()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Custom Beautiful Native Dialog (Toast Notifications) -->
        <div id="toast-container" class="absolute top-16 left-4 right-4 z-50 pointer-events-none flex flex-col gap-2"></div>

    </div>

    <script>
        const INITIAL_PRODUCTS = [
            {
                id: "p1",
                name: "Bumi Manusia",
                category: "Novel",
                price: 99000,
                description: "Karya agung Pramoedya Ananta Toer yang berkisah tentang perjuangan cinta dan hak asasi Minke di zaman kolonialisme Belanda. Buku wajib bagi pencinta sastra dunia.",
                image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400",
                badge: "Terlaris"
            },
            {
                id: "p2",
                name: "Filosofi Teras",
                category: "Self Improvement",
                price: 78000,
                description: "Panduan praktis filsafat stoikisme untuk mengatasi kecemasan dan membangun ketangguhan mental dalam kehidupan modern yang serba cepat.",
                image: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=400",
                badge: "Populer"
            },
            {
                id: "p3",
                name: "Laskar Pelangi",
                category: "Sastra Indonesia",
                price: 89000,
                description: "Sebuah memoar indah dari Andrea Hirata mengenai indahnya persahabatan, keterbatasan pendidikan, dan kekuatan mimpi anak-anak Belitong.",
                image: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&q=80&w=400",
                badge: "Rekomendasi"
            },
            {
                id: "p4",
                name: "Laut Bercerita",
                category: "Novel Sejarah",
                price: 115000,
                description: "Novel karya Leila S. Chudori yang mengangkat tema kepedihan keluarga korban penculikan aktivis 1998, sebuah refleksi mendalam tentang keadilan.",
                image: "https://images.unsplash.com/photo-1476275466078-4007374efbbe?auto=format&fit=crop&q=80&w=400",
                badge: "Terbaru"
            }
        ];

        const INITIAL_BANNERS = [
            { id: "b1", title: "Festival Literasi Nusantara", subtitle: "Diskon s/d 40% untuk Semua Novel Pilihan", image: "https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&q=80&w=800" },
            { id: "b2", title: "Mulai Kebiasaan Baru", subtitle: "Buku Self-Development Terlengkap & Terlaris", image: "https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?auto=format&fit=crop&q=80&w=800" }
        ];

        const INITIAL_SITE_SETTINGS = {
            name: "Nara Pustaka",
            email: "narapustaka1@gmail.com",
            address: "Bogor, Jawa Barat, Indonesia",
            whatsapp: "082130872054",
            instagram: "@nara_pustaka",
            tiktok: "@nara_pustaka",
            facebook: "Nara Pustaka Indonesia",
            youtube: "Nara Pustaka TV",
            about: "Nara Pustaka adalah destinasi literasi digital utama yang didirikan untuk menghadirkan karya-karya sastra dan pengetahuan bermutu tinggi langsung ke genggaman Anda.",
            operationalHours: "Setiap Hari (08:00 - 21:00 WIB)",
            copyright: "Nara Pustaka",
            googleAppsScriptUrl: "https://script.google.com/macros/s/AKfycbzZCnEGeCSUhgYyY8lC0QKXewlCkHaXDmrqEk81PA1bZGUceka6Q6xj8SjYb4JEfQhplA/exec" // URL Apps Script yang baru saja Anda deploy
        };

        const Storage = {
            get: (key, fallback) => {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : fallback;
            },
            set: (key, value) => {
                localStorage.setItem(key, JSON.stringify(value));
            }
        };

        let products = Storage.get('np_products', INITIAL_PRODUCTS);
        let banners = Storage.get('np_banners', INITIAL_BANNERS);
        let siteSettings = Storage.get('np_settings', INITIAL_SITE_SETTINGS);

        // Otomatis menimpa konfigurasi lama dengan URL API baru Anda jika sebelumnya terdeteksi kosong
        if (!siteSettings.googleAppsScriptUrl || siteSettings.googleAppsScriptUrl.trim() === '') {
            siteSettings.googleAppsScriptUrl = "https://script.google.com/macros/s/AKfycbzZCnEGeCSUhgYyY8lC0QKXewlCkHaXDmrqEk81PA1bZGUceka6Q6xj8SjYb4JEfQhplA/exec";
            Storage.set('np_settings', siteSettings);
        }

        let users = Storage.get('np_users', [
            { name: "Deby Verona", email: "deby@verona.com", password: "user123", hp: "082130872054", addresses: [{ id: "a1", label: "Rumah Utama", detail: "Jalan Pajajaran No. 24, Baranangsiang, Bogor Timur, Kota Bogor, Jawa Barat", isDefault: true }] }
        ]);
        let currentUser = Storage.get('np_current_user', null);
        let orders = Storage.get('np_orders', []);

        function persistState() {
            Storage.set('np_products', products);
            Storage.set('np_banners', banners);
            Storage.set('np_settings', siteSettings);
            Storage.set('np_users', users);
            Storage.set('np_current_user', currentUser);
            Storage.set('np_orders', orders);
        }

        async function sendToGoogleSheets(action, payload) {
            const url = siteSettings.googleAppsScriptUrl;
            if (!url || url.trim() === '') {
                console.log("URL Google Apps Script kosong. Data disimpan di LocalStorage saja.");
                return;
            }
            try {
                await fetch(url, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        action: action,
                        data: payload
                    })
                });
                console.log(`Integrasi Spreadsheet [${action}] Berhasil dikirim.`);
            } catch (error) {
                console.error("Gagal mengirim data ke Google Sheets:", error);
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-lg flex items-center gap-3 text-sm font-sans font-medium transition-all duration-300 translate-y-2 opacity-0 text-white ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-500'
            }`;
            
            const icon = type === 'success' 
                ? '<i class="fa-solid fa-circle-check text-lg"></i>' 
                : type === 'error' 
                ? '<i class="fa-solid fa-circle-xmark text-lg"></i>' 
                : '<i class="fa-solid fa-circle-exclamation text-lg"></i>';

            toast.innerHTML = `${icon}<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleImageUpload(inputElement, callback) {
            const file = inputElement.files[0];
            if (!file) return;
            if (file.size > 3 * 1024 * 1024) {
                showToast("Ukuran file terlalu besar! Maksimum 3MB.", "error");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                callback(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        const router = {
            currentPath: 'home',
            params: {},
            navigate: function(path, params = {}) {
                // Wajib login untuk melihat pesanan
                if (path === 'orders' && !currentUser) {
                    showToast("Silakan login atau buat akun terlebih dahulu untuk melihat pesanan!", "warning");
                    this.navigate('login');
                    return;
                }

                this.currentPath = path;
                this.params = params;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                const navButtons = ['home', 'products', 'orders', 'profile'];
                navButtons.forEach(btn => {
                    const el = document.getElementById(`nav-${btn}`);
                    if (el) {
                        if (path === btn || (btn === 'products' && (path === 'product-detail' || path === 'checkout'))) {
                            el.classList.add('active-tab');
                            el.classList.remove('text-slate-400');
                        } else {
                            el.classList.remove('active-tab');
                            el.classList.add('text-slate-400');
                        }
                    }
                });

                const logoText = document.getElementById('header-logo-text');
                const isSubpage = !['home', 'products', 'orders', 'profile'].includes(path);
                
                if (isSubpage) {
                    logoText.innerHTML = `
                        <button onclick="router.back()" class="mr-1 text-slate-700 hover:text-primary-600">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <span>${this.getPageTitle(path)}</span>
                    `;
                } else {
                    logoText.innerHTML = `<span>${siteSettings.name}</span>`;
                }

                const avatarContainer = document.getElementById('header-avatar');
                if (currentUser) {
                    avatarContainer.innerHTML = `
                        <button onclick="router.navigate('profile')" class="w-9 h-9 rounded-full bg-primary-100 text-primary-700 font-bold flex items-center justify-center border-2 border-primary-200">
                            ${currentUser.name.charAt(0).toUpperCase()}
                        </button>
                    `;
                } else {
                    avatarContainer.innerHTML = `
                        <button onclick="router.navigate('login')" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                            Masuk
                        </button>
                    `;
                }
            },
            back: function() {
                this.navigate('home');
            },
            getPageTitle: function(path) {
                switch(path) {
                    case 'product-detail': return 'Detail Buku';
                    case 'checkout': return 'Form Pemesanan';
                    case 'login': return 'Masuk Ke Akun';
                    case 'register': return 'Buat Akun';
                    case 'admin-login': return 'Akses Admin';
                    case 'admin-dashboard': return 'Dashboard Admin';
                    case 'search': return 'Cari Buku';
                    default: return siteSettings.name;
                }
            },
            render: function() {
                const appView = document.getElementById('app-view');
                appView.innerHTML = getSkeletonLoader();

                setTimeout(() => {
                    try {
                        const content = views[this.currentPath] ? views[this.currentPath](this.params) : views['home']();
                        appView.innerHTML = content;
                        
                        if (postRenders[this.currentPath]) {
                            postRenders[this.currentPath](this.params);
                        }
                    } catch(err) {
                        console.error("Rendering Error: ", err);
                        appView.innerHTML = `<div class="p-6 text-center text-rose-600 font-medium">Gagal memuat halaman. Silakan muat ulang halaman.</div>`;
                    }
                }, 400);
            }
        };

        function getSkeletonLoader() {
            return `
                <div class="p-5 space-y-6 animate-pulse">
                    <div class="h-44 bg-slate-200 rounded-3xl w-full"></div>
                    <div class="flex gap-3 overflow-x-hidden">
                        <div class="h-10 bg-slate-200 rounded-full w-24 flex-shrink-0"></div>
                        <div class="h-10 bg-slate-200 rounded-full w-24 flex-shrink-0"></div>
                        <div class="h-10 bg-slate-200 rounded-full w-24 flex-shrink-0"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-3">
                            <div class="h-36 bg-slate-200 rounded-2xl w-full"></div>
                            <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                            <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                        </div>
                        <div class="space-y-3">
                            <div class="h-36 bg-slate-200 rounded-2xl w-full"></div>
                            <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                            <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        const postRenders = {};
    </script>

    <script>
        const views = {};

        // 1. Landing Page View
        views['home'] = function() {
            let bannerSlidesHTML = '';
            banners.forEach((b, index) => {
                bannerSlidesHTML += `
                    <div class="relative w-full h-44 rounded-3xl overflow-hidden shadow-premium flex-shrink-0 bg-slate-900 text-white ${index !== 0 ? 'hidden' : ''}" id="banner-slide-${index}">
                        <img src="${b.image}" class="absolute inset-0 w-full h-full object-cover opacity-60" onerror="this.src='https://placehold.co/600x300/1e293b/ffffff?text=Nara+Pustaka'">
                        <div class="relative z-10 p-5 flex flex-col justify-end h-full bg-gradient-to-t from-slate-950/80 to-transparent">
                            <span class="text-[10px] bg-primary-600 text-white font-semibold px-2 py-0.5 rounded-full w-max mb-1.5 uppercase tracking-wider">Promo</span>
                            <h3 class="font-bold text-base leading-tight">${b.title}</h3>
                            <p class="text-[11px] text-slate-200 mt-1 line-clamp-1">${b.subtitle}</p>
                        </div>
                    </div>
                `;
            });

            if (banners.length === 0) {
                bannerSlidesHTML = `
                    <div class="relative w-full h-44 rounded-3xl overflow-hidden shadow-premium bg-gradient-to-tr from-primary-800 to-teal-500 text-white p-6 flex flex-col justify-end">
                        <h3 class="font-bold text-lg leading-tight">Selamat Datang di ${siteSettings.name}</h3>
                        <p class="text-xs text-slate-200 mt-1">Platform Belanja Literatur Premium Terlengkap & Tepercaya.</p>
                    </div>
                `;
            }

            const listNewest = products.slice(-2);
            const listPopular = products.slice(0, 4);

            let newestGridHTML = '';
            listNewest.forEach(p => {
                newestGridHTML += generateProductCard(p);
            });

            let popularGridHTML = '';
            listPopular.forEach(p => {
                popularGridHTML += generateProductCard(p);
            });

            return `
                <div class="space-y-6 px-5 pt-4">
                    <!-- Banners & Carousel -->
                    <div class="relative">
                        <div class="flex gap-4 overflow-x-auto no-scrollbar" id="banner-carousel-container">
                            ${bannerSlidesHTML}
                        </div>
                        <div class="flex justify-center gap-1.5 mt-3">
                            ${banners.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === 0 ? 'bg-primary-600' : 'bg-slate-300'} transition-all" id="dot-${i}"></span>`).join('')}
                        </div>
                    </div>

                    <!-- Category Pills -->
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-slate-800 text-sm tracking-tight">Kategori Populer</h3>
                        </div>
                        <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                            <button onclick="router.navigate('products', {category: ''})" class="px-4 py-2.5 rounded-2xl bg-white shadow-sm border border-slate-100 text-xs font-semibold text-primary-700 whitespace-nowrap hover:border-primary-500 transition-all flex items-center gap-2">

        postRenders['home'] = function() {
            let currentSlide = 0;
            const totalSlides = banners.length;
            if (totalSlides <= 1) return;

            const interval = setInterval(() => {
                if (router.currentPath !== 'home') {
                    clearInterval(interval);
                    return;
                }
                
                const currentEl = document.getElementById(`banner-slide-${currentSlide}`);
                const currentDot = document.getElementById(`dot-${currentSlide}`);
                if (currentEl) currentEl.classList.add('hidden');
                if (currentDot) {
                    currentDot.classList.remove('bg-primary-600');
                    currentDot.classList.add('bg-slate-300');
                }

                currentSlide = (currentSlide + 1) % totalSlides;

                const nextEl = document.getElementById(`banner-slide-${currentSlide}`);
                const nextDot = document.getElementById(`dot-${currentSlide}`);
                if (nextEl) nextEl.classList.remove('hidden');
                if (nextDot) {
                    nextDot.classList.remove('bg-slate-300');
                    nextDot.classList.add('bg-primary-600');
                }
            }, 4000);
        };

        function generateProductCard(p) {
            return `
                <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-card hover:shadow-lg transition-all duration-300 flex flex-col justify-between group">
                    <div class="relative overflow-hidden aspect-[4/5] bg-slate-100">

                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleOrderCheckoutProcess(productId, qty = 1, note = '') {
            if (!currentUser) {
                showToast("Silakan buat akun terlebih dahulu untuk melakukan pemesanan!", "warning");
                sessionStorage.setItem('pending_checkout', JSON.stringify({
                    id: productId,
                    qty: qty,
                    note: note
                }));
                setTimeout(() => {
                    router.navigate('register'); // Alihkan paksa ke halaman registrasi
                }, 1000);
            } else {
                router.navigate('checkout', { id: productId, qty: qty, note: note });
            }
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

    <script>
        views['products'] = function(params) {
            const selectedCategory = params && params.category ? params.category : '';
            const categories = [...new Set(products.map(p => p.category))];
            
            let filterButtonsHTML = `
                <button onclick="filterCatalogBy('')" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${!selectedCategory ? 'bg-primary-600 text-white shadow-md shadow-primary-100' : 'bg-white border border-slate-100 text-slate-600'}" data-category="">
                    Semua
                </button>
            `;
            
            categories.forEach(cat => {
                filterButtonsHTML += `
                    <button onclick="filterCatalogBy('${cat}')" class="catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-primary-600 text-white shadow-md shadow-primary-100' : 'bg-white border border-slate-100 text-slate-600'}" data-category="${cat}">
                        ${cat}
                    </button>
                `;
            });

            const filtered = selectedCategory ? products.filter(p => p.category === selectedCategory) : products;

            let productCardsHTML = '';
            filtered.forEach(p => {
                productCardsHTML += generateProductCard(p);
            });

            return `
                <div class="p-5 space-y-5">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="catalog-search" oninput="searchCatalog(this.value)" placeholder="Cari judul buku atau penulis..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200/80 rounded-2xl text-xs font-medium focus:ring-2 focus:ring-primary-500 focus:outline-none shadow-sm placeholder-slate-400">
                    </div>

                    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                        ${filterButtonsHTML}
                    </div>

                    <div class="grid grid-cols-2 gap-4" id="catalog-grid">
                        ${productCardsHTML || '<div class="col-span-2 text-center py-12 text-slate-400 text-xs font-medium">Buku tidak ditemukan</div>'}
                    </div>
                </div>
            `;
        };

        function filterCatalogBy(cat) {
            const btns = document.querySelectorAll('.catalog-filter-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('data-category') === cat) {
                    btn.className = "catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-primary-600 text-white shadow-md shadow-primary-100";
                } else {
                    btn.className = "catalog-filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-white border border-slate-100 text-slate-600";
                }
            });

            const grid = document.getElementById('catalog-grid');
            const filtered = cat ? products.filter(p => p.category === cat) : products;
            
            let html = '';
            filtered.forEach(p => {
                html += generateProductCard(p);
            });
            grid.innerHTML = html || '<div class="col-span-2 text-center py-12 text-slate-400 text-xs font-medium">Buku tidak ditemukan</div>';
        }

        function searchCatalog(keyword) {
            const grid = document.getElementById('catalog-grid');
            const searchVal = keyword.toLowerCase().trim();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(searchVal) || 
                p.category.toLowerCase().includes(searchVal) ||
                p.description.toLowerCase().includes(searchVal)
            );

            let html = '';
            filtered.forEach(p => {
                html += generateProductCard(p);
            });
            grid.innerHTML = html || '<div class="col-span-2 text-center py-12 text-slate-400 text-xs font-medium">Buku tidak ditemukan</div>';
        }

        views['search'] = function() {
            return views['products']();
        };
    </script>

    <script>
        views['checkout'] = function(params) {
            const product = products.find(p => p.id === params.id);
            if (!product) {
                return `<div class="p-6 text-center">Buku tidak dipilih untuk dipesan.</div>`;
            }

            const initialQty = params.qty || 1;
            const initialNote = params.note || '';

            const userName = currentUser ? currentUser.name : '';
            const userEmail = currentUser ? currentUser.email : '';
            const userHp = currentUser ? (currentUser.hp || '') : '';
            
            let userAddress = '';
            if (currentUser && currentUser.addresses && currentUser.addresses.length > 0) {
                const defAddr = currentUser.addresses.find(a => a.isDefault) || currentUser.addresses[0];
                userAddress = defAddr.detail;
            }

            return `
                <div class="p-5 space-y-5">
                    <div class="flex gap-4 p-3 bg-white rounded-2xl border border-slate-100 shadow-sm">
                        <img src="${product.image}" class="w-16 h-20 object-cover rounded-xl bg-slate-100" onerror="this.src='https://placehold.co/100x120/0d9488/ffffff?text=${product.name}'">
                        <div class="flex-1 flex flex-col justify-center">
                            <span class="text-[9px] text-slate-400 uppercase font-semibold tracking-wider">${product.category}</span>
                            <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${product.name}</h4>
                            <div class="font-extrabold text-sm text-primary-600 mt-1">${formatRupiah(product.price)}</div>
                        </div>
                    </div>

                    <form id="checkout-form" onsubmit="processOrderCheckout(event, '${product.id}')" class="space-y-4">
                        <div class="bg-white rounded-3xl p-5 border border-slate-100 space-y-3.5 shadow-sm">
                            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-widest border-b border-slate-100 pb-2 flex items-center gap-1.5">
                                <i class="fa-solid fa-address-card text-primary-600"></i> Informasi Kontak Pemesan
                            </h3>
                            
                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase">Nama Lengkap</label>
                                <input type="text" id="co-name" value="${userName}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-primary-500 focus:outline-none">
                            </div>

                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase">Email</label>
                                <input type="email" id="co-email" value="${userEmail}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-primary-500 focus:outline-none">
                            </div>

                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase">Nomor HP / WhatsApp</label>
                                <input type="tel" id="co-hp" value="${userHp}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-primary-500 focus:outline-none" placeholder="08XXXXXXXXXX">
                            </div>

                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-500 uppercase">Alamat Lengkap Pengiriman</label>
                                <textarea id="co-address" required rows="3" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-primary-500 focus:outline-none">${userAddress}</textarea>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl p-5 border border-slate-100 space-y-3.5 shadow-sm">
                            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-widest border-b border-slate-100 pb-2 flex items-center gap-1.5">
                                <i class="fa-solid fa-basket-shopping text-primary-600"></i> Detail Pembelian

                                    <button type="button" onclick="adjustCoQty(-1, ${product.price})" class="px-2.5 py-1.5 text-slate-500 hover:text-primary-600 transition"><i class="fa-solid fa-minus text-[10px]"></i></button>

                                </div>

        function adjustCoQty(amount, price) {
            const qtyEl = document.getElementById('co-qty');
            if (!qtyEl) return;
            
            let qty = parseInt(qtyEl.innerText) + amount;
            if (qty < 1) qty = 1;
            qtyEl.innerText = qty;
            
            const totalEl = document.getElementById('co-total');
            if (totalEl) {
                totalEl.innerText = formatRupiah(price * qty);
            }
        }

        async function processOrderCheckout(event, productId) {
            event.preventDefault();
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const name = document.getElementById('co-name').value;
            const email = document.getElementById('co-email').value;
            const hp = document.getElementById('co-hp').value;
            const address = document.getElementById('co-address').value;
            const qty = parseInt(document.getElementById('co-qty').innerText);
            const note = document.getElementById('co-note').value;
            const total = product.price * qty;

                userHp: hp,
                productName: product.name,
                productId: product.id,
                qty: qty,
                note: note,
                total: total
            };

            orders.unshift(newOrder);

            // Kirim data ke Google Sheets secara otomatis
            await sendToGoogleSheets('addOrder', newOrder);

Saya ingin melakukan pemesanan.
===================
Nama : ${name}
Email : ${email}
Nomor HP : ${hp}
Alamat : ${address}
Produk : ${product.name}
Jumlah : ${qty}
Catatan : ${note || '-'}
===================
Terima kasih.`;

        async function handleUserRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const hp = document.getElementById('reg-hp').value.trim();
            const pwd = document.getElementById('reg-pwd').value;
            const pwdConfirm = document.getElementById('reg-pwd-confirm').value;

            if (pwd.length < 6) {
                showToast("Password minimal terdiri dari 6 karakter!", "error");
                return;
            }

            if (pwd !== pwdConfirm) {
                showToast("Konfirmasi password tidak cocok!", "error");
                return;
            }

            const exists = users.some(u => u.email.toLowerCase() === email.toLowerCase());
            if (exists) {
                showToast("Email tersebut sudah terdaftar!", "error");
                return;
            }

            const newUser = {
                name: name,
                email: email,
                password: pwd,
                hp: hp,
                addresses: []
            };

            users.push(newUser);
            currentUser = newUser;
            persistState();

            // Simpan otomatis ke Google Sheets
            await sendToGoogleSheets('addUser', newUser);

            showToast("Registrasi berhasil! Selamat Datang.", "success");

            // Periksa jika ada pesanan tertunda
            const pending = sessionStorage.getItem('pending_checkout');
            if (pending) {
                const data = JSON.parse(pending);
                sessionStorage.removeItem('pending_checkout');
                router.navigate('checkout', { id: data.id, qty: data.qty, note: data.note });
            } else {
                router.navigate('home');
            }
        }

                            </div>

                    `;
                });

                addressesHTML = '<p class="text-center py-4 text-xs text-slate-400 font-medium">Belum ada alamat pengiriman.</p>';

            return `
                <div class="p-5 space-y-5">

                                <i class="fa-solid fa-plus"></i> Tambah Alamat

                        </div>

                        <div id="address-form-container" class="hidden bg-slate-50 border border-slate-200/60 rounded-2xl p-4 space-y-3 animate-fade-in">

                                <label class="text-[9px] font-bold text-slate-500">Alamat Lengkap</label>

                            </div>
                            <div class="flex gap-2 justify-end pt-1">

                                <button type="button" onclick="saveAddress()" class="px-3 py-1.5 bg-primary-600 text-white text-[10px] font-bold rounded-lg">Simpan</button>

                    </button>

        function toggleAddressForm(show, title = "Tambah Alamat Baru") {
            const container = document.getElementById('address-form-container');
            const titleEl = document.getElementById('addr-form-title');
            if (container) {
                container.classList.toggle('hidden', !show);
                titleEl.innerText = title;
            }
            if(!show) {
                document.getElementById('addr-id').value = '';
                document.getElementById('addr-label').value = '';
                document.getElementById('addr-detail').value = '';
            }
        }

        function saveAddress() {
            const id = document.getElementById('addr-id').value;
            const label = document.getElementById('addr-label').value.trim();
            const detail = document.getElementById('addr-detail').value.trim();

            if (!label || !detail) {
                showToast("Lengkapi semua field alamat!", "error");
                return;
            }

            if (!currentUser.addresses) currentUser.addresses = [];

            if (id) {
                const index = currentUser.addresses.findIndex(a => a.id === id);
                if (index !== -1) {
                    currentUser.addresses[index].label = label;
                    currentUser.addresses[index].detail = detail;
                }
            } else {
                const newAddress = {
                    id: 'addr-' + Date.now(),
                    label: label,
                    detail: detail,
                    isDefault: currentUser.addresses.length === 0
                };
                currentUser.addresses.push(newAddress);
            }

            const uIndex = users.findIndex(u => u.email === currentUser.email);
            if (uIndex !== -1) {
                users[uIndex] = currentUser;
            }

            persistState();
            showToast("Alamat berhasil diperbarui!", "success");
            toggleAddressForm(false);
            router.navigate('profile');
        }

        function openEditAddressModal(addrId) {
            const addr = currentUser.addresses.find(a => a.id === addrId);
            if (addr) {
                toggleAddressForm(true, "Ubah Alamat Pengiriman");
                document.getElementById('addr-id').value = addr.id;
                document.getElementById('addr-label').value = addr.label;
                document.getElementById('addr-detail').value = addr.detail;
            }
        }

        function deleteAddress(addrId) {
            currentUser.addresses = currentUser.addresses.filter(a => a.id !== addrId);
            if (currentUser.addresses.length > 0 && !currentUser.addresses.some(a => a.isDefault)) {
                currentUser.addresses[0].isDefault = true;
            }

            const uIndex = users.findIndex(u => u.email === currentUser.email);
            if (uIndex !== -1) {
                users[uIndex] = currentUser;
            }

            persistState();
            showToast("Alamat berhasil dihapus!", "success");
            router.navigate('profile');
        }

        function setDefaultAddress(addrId) {
            currentUser.addresses.forEach(a => {
                a.isDefault = a.id === addrId;
            });

            const uIndex = users.findIndex(u => u.email === currentUser.email);
            if (uIndex !== -1) {
                users[uIndex] = currentUser;
            }

            persistState();
            showToast("Alamat utama diperbarui!", "success");
            router.navigate('profile');
        }

        function handleLogout() {
            currentUser = null;
            persistState();
            showToast("Anda telah berhasil keluar.", "success");
            router.navigate('home');
        }
    </script>

            tabButtons.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-primary-600 text-white";
                    } else {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 bg-transparent hover:text-white";
                    }
                }
            });

            const subview = document.getElementById('admin-subview');
            if (subview) {
                subview.innerHTML = adminSubViews[tab] ? adminSubViews[tab]() : adminSubViews['dash']();
            }
        }

            showToast("Keluar dari Sesi Admin.", "success");
            router.navigate('home');

        function toggleProductFormAdmin(show) {
            const form = document.getElementById('admin-product-form');
            if (form) form.classList.toggle('hidden', !show);
            if (!show) {
                document.getElementById('admin-prod-id').value = '';
                document.getElementById('admin-prod-name').value = '';
                document.getElementById('admin-prod-cat').value = '';
                document.getElementById('admin-prod-price').value = '';
                document.getElementById('admin-prod-desc').value = '';
                document.getElementById('admin-prod-image-preview').classList.add('hidden');
                document.getElementById('admin-prod-image-placeholder').classList.remove('hidden');
                tempProdImageBase64 = '';
            }
        }

        function uploadProductImage(input) {
            handleImageUpload(input, function(base64) {
                tempProdImageBase64 = base64;
                const preview = document.getElementById('admin-prod-image-preview');
                const placeholder = document.getElementById('admin-prod-image-placeholder');
                if (preview && placeholder) {
                    preview.src = base64;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    showToast("Gambar terunggah dan diproses!", "success");
                }
            });
        }

        async function saveProductAdmin() {
            const id = document.getElementById('admin-prod-id').value;
            const name = document.getElementById('admin-prod-name').value.trim();
            const category = document.getElementById('admin-prod-cat').value.trim();
            const price = parseFloat(document.getElementById('admin-prod-price').value);
            const desc = document.getElementById('admin-prod-desc').value.trim();

            if (!name || !category || isNaN(price) || !desc) {
                showToast("Mohon lengkapi semua field produk!", "error");
                return;
            }

            const finalImage = tempProdImageBase64 || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400';
            let activeProduct = null;

            if (id) {
                const idx = products.findIndex(p => p.id === id);
                if (idx !== -1) {
                    products[idx].name = name;
                    products[idx].category = category;
                    products[idx].price = price;
                    products[idx].description = desc;
                    if (tempProdImageBase64) products[idx].image = tempProdImageBase64;
                    activeProduct = products[idx];
                }
            } else {
                activeProduct = {
                    id: 'p-' + Date.now(),
                    name: name,
                    category: category,
                    price: price,
                    description: desc,
                    image: finalImage,
                    badge: "Terbaru"
                };
                products.push(activeProduct);
            }

            persistState();
            await sendToGoogleSheets('syncProducts', products);
            showToast("Produk Berhasil Diperbarui!", "success");
            toggleProductFormAdmin(false);
            switchAdminTab('products');
        }

        function openProductEditForm(id) {
            const p = products.find(p => p.id === id);
            if (p) {
                toggleProductFormAdmin(true);
                document.getElementById('prod-form-title').innerText = "Edit Detail Buku";
                document.getElementById('admin-prod-id').value = p.id;
                document.getElementById('admin-prod-name').value = p.name;
                document.getElementById('admin-prod-cat').value = p.category;
                document.getElementById('admin-prod-price').value = p.price;
                document.getElementById('admin-prod-desc').value = p.description;
                
                const preview = document.getElementById('admin-prod-image-preview');
                const placeholder = document.getElementById('admin-prod-image-placeholder');
                if (p.image) {
                    preview.src = p.image;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    tempProdImageBase64 = p.image;
                }
            }
        }

        async function deleteProductAdmin(id) {
            products = products.filter(p => p.id !== id);
            persistState();
            await sendToGoogleSheets('syncProducts', products);
            showToast("Produk dihapus!", "success");
            switchAdminTab('products');
        }

        let tempBannerImageBase64 = '';

        function toggleBannerFormAdmin(show) {
            const form = document.getElementById('admin-banner-form');
            if (form) form.classList.toggle('hidden', !show);
            if (!show) {
                document.getElementById('admin-banner-title').value = '';
                document.getElementById('admin-banner-sub').value = '';
                document.getElementById('admin-banner-preview').classList.add('hidden');
                document.getElementById('admin-banner-placeholder').classList.remove('hidden');
                tempBannerImageBase64 = '';
            }
        }

        function uploadBannerImage(input) {
            handleImageUpload(input, function(base64) {
                tempBannerImageBase64 = base64;
                const preview = document.getElementById('admin-banner-preview');
                const placeholder = document.getElementById('admin-banner-placeholder');
                if (preview && placeholder) {
                    preview.src = base64;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    showToast("Foto banner terproses!", "success");
                }
            });
        }

        async function saveBannerAdmin() {
            const title = document.getElementById('admin-banner-title').value.trim();
            const sub = document.getElementById('admin-banner-sub').value.trim();

            if (!title || !sub || !tempBannerImageBase64) {
                showToast("Semua field & Gambar banner wajib dilengkapi!", "error");
                return;
            }

            const newBanner = {
                id: 'b-' + Date.now(),
                title: title,
                subtitle: sub,
                image: tempBannerImageBase64
            };

            banners.push(newBanner);
            persistState();
            await sendToGoogleSheets('syncBanners', banners);
            showToast("Banner promo ditambahkan!", "success");
            toggleBannerFormAdmin(false);
            switchAdminTab('banners');
        }

        async function deleteBannerAdmin(id) {
            banners = banners.filter(b => b.id !== id);
            persistState();
            await sendToGoogleSheets('syncBanners', banners);
            showToast("Banner dihapus!", "success");
            switchAdminTab('banners');
        }

        async function updateOrderStatusAdmin(orderId, nextStatus) {
            const idx = orders.findIndex(o => o.id === orderId);
            if (idx !== -1) {
                orders[idx].status = nextStatus;
                persistState();
                await sendToGoogleSheets('updateOrderStatus', { id: orderId, status: nextStatus });
                showToast(`Status pesanan ${orderId} diubah ke ${nextStatus}!`, "success");
            }
        }

        async function saveSiteSettingsAdmin(event) {
            event.preventDefault();
            
            siteSettings.googleAppsScriptUrl = document.getElementById('set-script-url').value.trim();
            siteSettings.name = document.getElementById('set-name').value.trim();
            siteSettings.email = document.getElementById('set-email').value.trim();
            siteSettings.whatsapp = document.getElementById('set-wa').value.trim();
            siteSettings.address = document.getElementById('set-address').value.trim();
            siteSettings.operationalHours = document.getElementById('set-hours').value.trim();
            siteSettings.about = document.getElementById('set-about').value.trim();
            siteSettings.instagram = document.getElementById('set-ig').value.trim();
            siteSettings.tiktok = document.getElementById('set-tt').value.trim();
            siteSettings.facebook = document.getElementById('set-fb').value.trim();
            siteSettings.youtube = document.getElementById('set-yt').value.trim();
            siteSettings.copyright = document.getElementById('set-copyright').value.trim();

            persistState();
            await sendToGoogleSheets('updateSettings', siteSettings);
            showToast("Semua Pengaturan Website Tersimpan!", "success");
            switchAdminTab('settings');
        }
    </script>

    <script>
        function registerMockServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'nara-pustaka-v2';
                    const urlsToCache = [
                        '/',
                        '/index.html',
                        'https://cdn.tailwindcss.com',
                        'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap',
                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'
                    ];

                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open(CACHE_NAME).then(cache => {
                                return cache.addAll(urlsToCache);
                            })
                        );
                    });

                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request).then(response => {
                                return response || fetch(event.request);
                            })
                        );
                    });
                `;

                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('Mock Service Worker Registered Successfully.'))
                    .catch(err => console.log('Mock Service Worker Registration failed: ', err));
            }
        }

        function injectDynamicManifest() {
            const manifestObj = {
                "name": "Nara Pustaka Mobile App",
                "short_name": "Nara Pustaka",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#f8fafc",
                "theme_color": "#0d9488",
                "icons": [
                    {
                        "src": "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=192",
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any maskable"
                    },
                    {
                        "src": "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=512",
                        "sizes": "512x512",
                        "type": "image/png"
                    }
                ]
            };

            const stringManifest = JSON.stringify(manifestObj);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            
            const linkElement = document.createElement('link');
            linkElement.setAttribute('rel', 'manifest');
            linkElement.setAttribute('href', manifestURL);
            document.head.appendChild(linkElement);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            const pwaToast = document.getElementById('pwa-toast');
            if (pwaToast) pwaToast.classList.remove('hidden');
        });

        setTimeout(() => {
            const pwaToast = document.getElementById('pwa-toast');
            if (pwaToast && !localStorage.getItem('np_pwa_dismissed')) {
                pwaToast.classList.remove('hidden');
            }
        }, 5000);

        function pwaSimulateInstall() {
            showToast("Nara Pustaka Berhasil Ditambahkan ke Layar Utama Anda!", "success");
            dismissPwaToast();
        }

        function dismissPwaToast() {
            const pwaToast = document.getElementById('pwa-toast');
            if (pwaToast) pwaToast.classList.add('hidden');
            localStorage.setItem('np_pwa_dismissed', 'true');
        }

        window.onload = function() {
            router.navigate('home');
            registerMockServiceWorker();
            injectDynamicManifest();
        };
    </script>
