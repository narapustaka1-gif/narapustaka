<script>
function downloadPDF() {
  const invoiceBox = document.querySelector('.invoice-box');
  const noPrintEls = document.querySelectorAll('.no-print');
  noPrintEls.forEach(el => el.style.display = 'none');
  const invNumber = document.getElementById('inv-number').value.replace(/\//g, '_');
  const opt = {
    margin: [0,0,0,0],
    filename: 'Invoice_NaraPustaka_' + invNumber + '.pdf',
    image: { type: 'jpeg', quality: 1 },
    html2canvas: { scale: 3, useCORS: true },
    jsPDF: { unit: 'in', format: 'a5', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(invoiceBox).save().then(() => {
    noPrintEls.forEach(el => el.style.display = '');
    showToast("Invoice berhasil diunduh ke PDF!");
  });
}
</script>
